<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="web,iosアプリ制作が出来ます。気軽にお問い合わせ下さい。">
    <link rel="apple-touch-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <title>ひろのサイト</title>
</head>

<body>
    <div class="home-content wrapper">
        <h2 class="page-title">
            <p>I am Hiro, a Japanese web and iOS app creator.</p>
            <!-- <p>Hiro</p> -->
        </h2>
        <h3>
            <p>If you have any questions or inquiries, please feel free to contact me!</p>
            <p>お気軽にお問い合わせください</p>
        </h3>
    </div>
    <div class="form-wrapper">
        <form id="contactForm">
            <h2>お問い合わせ</h2>
                <input type="text" name="company" style="display:none">
            <p>お問い合わせ内容をご記入の上送信ボタンを押してください。</p>
            <div class="form-group">
                <label for="name">お名前:</label>
                <input class="form-input" type="text" id="name" name="name" placeholder="例）山田 太郎" required>
            </div>
            <div class="form-group">
                <label for="email">メールアドレス:</label>
                <input class="form-input" type="email" id="email" name="email" placeholder="例）abcd@xyz.com" required>
            </div>
            <div class="form-group">
                <label for="message">お問い合わせ内容:</label>
                <textarea class="form-input" id="message" name="message" rows="5" placeholder="お問い合わせ内容をこちらにご記入ください"
                    required></textarea>
            </div>
            <div class="cf-turnstile" data-sitekey="0x4AAAAAADDu-Kx4N0jOlkO2"></div>
            <div class="form-group">
                <button class="form-button" type="submit">送信</button>
            </div>
        </form>
    </div>
    <div id="loading">
        <div class="loader"></div>
    </div>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <script>
        window.loadedAt = Date.now();
        document.getElementById("contactForm").addEventListener("submit", async function (event) {
            event.preventDefault(); // デフォルトのフォーム送信を防ぐ（URLが変わるのを防止）

            const formData = new FormData(this);
            const responseMessage = document.getElementById("responseMessage");
            const loading = document.getElementById("loading");
            const button = this.querySelector("button");


            // 👇 追加①：ページ表示時間
            const loadedAt = window.loadedAt;

            // 👇 追加②：Turnstileトークン取得
            const token = document.querySelector('[name="cf-turnstile-response"]').value;

            if (!token) {
                alert("認証を完了してください");
                return;
            }

            // 👇 追加③：送信用パラメータ作成
            const params = new URLSearchParams(formData);
            params.append("cfToken", token || "");
            params.append("loadedAt", loadedAt);

            try {
                loading.style.display = "flex"; // ローディング表示
                button.disabled = true;

                const response = await fetch("https://my-app.assgin.workers.dev/api/contact", {
                    method: "POST",
                    body: params, // `application/x-www-form-urlencoded` 形式で送信
                    headers: { "Content-Type": "application/x-www-form-urlencoded" }
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    alert("お問い合わせが送信されました！");
                } else {
                    throw new Error(result.message || "エラーが発生しました。");
                }
            } catch (error) {

                console.error(error);
                alert(error.message);
            } finally {
                loading.style.display = "none"; // ローディング非表示
                button.disabled = false;
            }
        });
    </script>
    <footer>
        <div class="wrapper">
            <small>
                <p>&copy; 2023 Hiro</p>
            </small>
        </div>
    </footer>
</body>

</html>
