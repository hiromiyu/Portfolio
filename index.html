<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="web,iosアプリ制作が出来ます。ios日記アプリDAYCEを開発したのでインストールしてみて下さい。気軽にお問い合わせ下さい。">
    <link rel="apple-touch-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <title>ひろのサイト</title>
</head>

<body>
    <div class="home-content wrapper">
        <h2 class="page-title">
            <p>web ios App Creator</p>
            <p>Hiro</p>
        </h2>
        <h3>
            <p>I am a Japanese web and ios App Creator
                if your have any comments, please feel free to contact me!</p>
            <p>お気軽にお問い合わせください</p>
        </h3>
    </div>
    <div class="app-img">
        <a
            href="https://apps.apple.com/us/app/dayce/id6444592652?itscg=30200&itsct=apps_box_badge&mttnsubad=6444592652">
            <img src="IMG_3796.WEBP" alt="DAYCEアプリのスクリーンショット"
                style="width: 100%; max-width: 500px; height: auto; overflow: hidden; display: inline-block; ">
        </a>
    </div>
    <div class="form-wrapper">
        <!-- <form id="contactForm" action="https://instead.onrender.com/contact" method="POST"> -->
        <form id="contactForm">
            <h2>お問い合わせ</h2>
            <p>お問い合わせ内容をご記入の上送信ボタンを押してください。</p>
            <div class="form-group">
                <label for="name">お名前:</label>
                <input class="form-input" type="text" id="name" name="name" placeholder="例）山田 太郎" required>
            </div>
            <div class="form-group">
                <label for="email">メールアドレス:</label>
                <input class="form-input" type="email" id="email" name="email" placeholder="例）abcd@xyz.com" required>
            </div>
            <div class="form-group">
                <label for="message">お問い合わせ内容:</label>
                <textarea class="form-input" id="message" name="message" rows="5" placeholder="お問い合わせ内容をこちらにご記入ください"
                    required></textarea>
            </div>
            <div class="form-group">
                <button class="form-button" type="submit">送信</button>
            </div>
        </form>
    </div>

    <!-- メッセージ表示エリア -->
    <div id="loading">
        <div class="loader"></div>
    </div>
    <script>
        document.getElementById("contactForm").addEventListener("submit", async function (event) {
            event.preventDefault(); // デフォルトのフォーム送信を防ぐ（URLが変わるのを防止）

            const formData = new FormData(this);
            const responseMessage = document.getElementById("responseMessage");
            const loading = document.getElementById("loading");

            try {
                loading.style.display = "flex"; // ローディング表示

                const response = await fetch("https://instead.onrender.com/contact", {
                    method: "POST",
                    body: new URLSearchParams(formData), // `application/x-www-form-urlencoded` 形式で送信
                    headers: { "Content-Type": "application/x-www-form-urlencoded" }
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    alert("お問い合わせが送信されました！");
                } else {
                    throw new Error(result.message || "エラーが発生しました。");
                }
            } catch (error) {

                console.error(error);
                alert(error.message);
            } finally {
                loading.style.display = "none"; // ローディング非表示
            }

        });
    </script>

        </ul>
    </div> -->

        <div class="wrapper">
            <small>
                <p>&copy; 2023 Hiro</p>
            </small>
        </div>
    </footer>
</body>

</html>
